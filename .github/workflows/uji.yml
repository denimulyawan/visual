name: uji

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    name: Uji render semua visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Jalankan uji
        run: node tools/render-test.mjs
